- answer: |
    $f(\mathbf{x}) = \|\mathbf{x}\|_2 = \sqrt{\sum_i x_i^2}$. By the chain
    rule, $\frac{\partial f}{\partial x_i} = \frac{1}{2\sqrt{\sum_j x_j^2}} \cdot 2x_i = \frac{x_i}{\|\mathbf{x}\|_2}$,
    so $\nabla f(\mathbf{x}) = \frac{\mathbf{x}}{\|\mathbf{x}\|_2}$, a unit
    vector pointing away from the origin.

    At $\mathbf{x} = \mathbf{0}$ this divides by zero: the norm is **not
    differentiable** there. Its graph is a cone with a sharp tip at the
    origin, where no single tangent plane exists. (Frameworks typically
    return 0 or `nan` there; using $\|\mathbf{x}\|^2$ instead avoids the
    problem.)
- answer: |
    $u$ depends on $a$ through all three paths ($x$, $y$, $z$), so we add
    the contributions:

    $$\frac{\partial u}{\partial a} = \frac{\partial u}{\partial x}\frac{\partial x}{\partial a} + \frac{\partial u}{\partial y}\frac{\partial y}{\partial a} + \frac{\partial u}{\partial z}\frac{\partial z}{\partial a},$$
    $$\frac{\partial u}{\partial b} = \frac{\partial u}{\partial x}\frac{\partial x}{\partial b} + \frac{\partial u}{\partial y}\frac{\partial y}{\partial b} + \frac{\partial u}{\partial z}\frac{\partial z}{\partial b}.$$

    In matrix form, $\nabla_{(a,b)} u$ is the $2 \times 3$ matrix of
    derivatives of $(x, y, z)$ with respect to $(a, b)$ times
    $\nabla_{(x,y,z)} u$, matching the section's $\nabla_{\mathbf{x}} y = \mathbf{A} \nabla_{\mathbf{u}} y$.
- answer: |
    Differentiate both sides of $f(f^{-1}(x)) = x$ with the chain rule:
    $f'(f^{-1}(x)) \cdot (f^{-1})'(x) = 1$, so

    $$(f^{-1})'(x) = \frac{1}{f'(f^{-1}(x))},$$

    valid wherever $f'(f^{-1}(x)) \neq 0$. Example: $f(x) = e^x$,
    $f^{-1}(x) = \log x$, so $(\log x)' = \frac{1}{e^{\log x}} = \frac{1}{x}$.
