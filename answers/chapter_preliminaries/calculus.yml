# Answers for chapter_preliminaries/calculus.md "Exercises", in order.
- answer: |
    Use $f'(x) = \lim_{h \to 0} \frac{f(x+h) - f(x)}{h}$.

    - **(i)** $f(x) = c$: $\frac{c - c}{h} = 0$, so $f'(x) = 0$.
    - **(ii)** $f(x) = x^n$ (integer $n$): by the binomial theorem,
      $(x+h)^n = x^n + n x^{n-1} h + O(h^2)$, so the quotient is
      $n x^{n-1} + O(h) \to n x^{n-1}$.
    - **(iii)** $f(x) = e^x$: $\frac{e^{x+h} - e^x}{h} = e^x \frac{e^h - 1}{h}$
      and $\lim_{h\to 0}\frac{e^h - 1}{h} = 1$ (the defining property of $e$),
      so $f'(x) = e^x$.
    - **(iv)** $f(x) = \log x$: $\frac{\log(x+h) - \log x}{h} = \frac{1}{h}\log\left(1 + \frac{h}{x}\right)$.
      Substituting $u = h/x$, this is $\frac{1}{x}\cdot\frac{\log(1+u)}{u} \to \frac{1}{x}$,
      since $\frac{\log(1+u)}{u} \to 1$.
- answer: |
    **Sum:** $\frac{[f(x+h)+g(x+h)] - [f(x)+g(x)]}{h} = \frac{f(x+h)-f(x)}{h} + \frac{g(x+h)-g(x)}{h} \to f' + g'$.

    **Product:** add and subtract $f(x+h)g(x)$:
    $\frac{f(x+h)g(x+h) - f(x)g(x)}{h} = f(x+h)\frac{g(x+h)-g(x)}{h} + g(x)\frac{f(x+h)-f(x)}{h} \to f g' + g f'$
    (using that differentiable $f$ is continuous, so $f(x+h) \to f(x)$).

    **Quotient:** write $f/g = f \cdot (1/g)$. From the definition,
    $\frac{1/g(x+h) - 1/g(x)}{h} = -\frac{g(x+h) - g(x)}{h} \cdot \frac{1}{g(x+h)g(x)} \to -\frac{g'}{g^2}$.
    Then the product rule gives $\frac{f'}{g} - \frac{f g'}{g^2} = \frac{g f' - f g'}{g^2}$.
- answer: |
    Take $g(x) = C$ in the product rule: $\frac{d}{dx}[C f(x)] = C f'(x) + f(x) \cdot \frac{d}{dx}C = C f'(x) + 0 = C f'(x)$.
- answer: |
    Write $x^x = e^{x \log x}$ (for $x > 0$). By the chain rule,
    $\frac{d}{dx} x^x = e^{x \log x} \cdot \frac{d}{dx}(x \log x) = x^x (\log x + 1)$.
- answer: |
    $f'(x) = 0$ means the tangent is **horizontal**: to first order, the
    function doesn't change near $x$. These are *stationary points*: a local
    minimum, a local maximum, or a saddle/inflection point.

    Examples: $f(x) = x^2$ at $x = 0$ (minimum), $f(x) = -x^2$ at $0$
    (maximum), $f(x) = x^3$ at $0$ (neither). In optimization, gradient
    descent stops moving where the gradient is zero, which is why we look for
    minima there, and why saddle points can slow training down.
- exercise: tangent-line
  answer: |
    $f'(x) = 3x^2 + \frac{1}{x^2}$, so $f'(1) = 4$, and $f(1) = 1 - 1 = 0$.
    The tangent at $x = 1$ is $y = 4(x - 1) = 4x - 4$.

    ```python
    x = np.arange(0.2, 3, 0.01)
    d2l.plot(x, [x ** 3 - 1 / x, 4 * x - 4], 'x', 'f(x)',
             legend=['f(x)', 'Tangent line (x=1)'])
    ```
