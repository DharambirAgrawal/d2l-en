# Answers for chapter_preliminaries/probability.md "Exercises", in order.
- answer: |
    Estimating a **fixed quantity** from repeated measurements: e.g., a
    coin's probability of heads. The estimate $\hat{p}$ has standard
    deviation $\sqrt{p(1-p)/n} \to 0$, so with enough tosses the uncertainty
    about **$p$** becomes arbitrarily small. (Similarly: measuring a
    physical constant with unbiased, independent measurement noise.)
- answer: |
    Predicting the **next coin toss**. More data pins down $p$ (epistemic
    uncertainty), but the toss itself stays random (aleatoric uncertainty):
    even knowing $p = 0.5$ exactly, you can't do better than 50%. The
    uncertainty stops shrinking once $p$ is known well enough that the
    remaining error is dominated by the inherent randomness, after a few
    hundred to a few thousand tosses (when $\sqrt{p(1-p)/n}$ is small
    compared to the irreducible spread).

    Real-world version: predicting a patient's outcome from a few
    measurements. More patients improve the model, but factors you don't
    observe leave irreducible uncertainty.
- exercise: coin-estimator-variance
  answer: |
    Each toss $X_i$ is Bernoulli with variance $p(1-p)$, and
    $\hat{p} = \frac{1}{n}\sum_i X_i$. For independent tosses,
    $\textrm{Var}[\hat{p}] = \frac{1}{n^2} \cdot n\, p(1-p) = \frac{p(1-p)}{n}$
    (at most $\frac{1}{4n}$).

    1. The variance scales like $1/n$, so the standard deviation shrinks like
       $1/\sqrt{n}$: 100$\times$ more tosses for 10$\times$ more precision.
    2. Chebyshev: $P(|\hat{p} - p| \geq \epsilon) \leq \frac{p(1-p)}{n\epsilon^2} \leq \frac{1}{4n\epsilon^2}$.
    3. The central limit theorem says $\hat{p}$ is approximately Gaussian
       with mean $p$ and variance $p(1-p)/n$. That gives much tighter
       bounds (e.g., about 95% within $2\sigma$, where Chebyshev only
       guarantees 75%), but only approximately and for large $n$, whereas
       Chebyshev holds exactly for every $n$.
- answer: |
    For each fixed $m$, yes: $z_m$ has mean 0 and variance $1/m$, so
    $P(|z_m| \geq \epsilon) \leq \frac{1}{m\epsilon^2}$.

    But you **can't** treat these bounds as holding for all $m$
    **simultaneously** as if they were independent events. The $z_m$ are
    strongly dependent (they share the same samples: $z_{m+1}$ is mostly
    $z_m$), and a statement about the whole sequence ("all of
    $z_1, \ldots, z_M$ are within $\epsilon$") needs a union bound over all
    $m$, which sums the probabilities and can exceed 1, or more refined
    tools (maximal inequalities). Bounds for single times don't compose into
    bounds for a whole trajectory for free.
- answer: |
    Let $a = P(\mathcal{A})$ and $b = P(\mathcal{B})$.

    - **Union:** $\max(a, b) \leq P(\mathcal{A} \cup \mathcal{B}) \leq \min(1, a + b)$.
      Lower bound when one event contains the other; upper bound when they
      are disjoint (or cover everything).
    - **Intersection:** $\max(0, a + b - 1) \leq P(\mathcal{A} \cap \mathcal{B}) \leq \min(a, b)$.
      Lower bound when they overlap as little as possible; upper bound when
      one contains the other.

    These follow from $P(\mathcal{A} \cup \mathcal{B}) = a + b - P(\mathcal{A} \cap \mathcal{B})$.
- answer: |
    By the chain rule of probability,
    $P(A, B, C) = P(A)\, P(B \mid A)\, P(C \mid A, B)$. Since $C$ depends
    only on $B$, $P(C \mid A, B) = P(C \mid B)$, so

    $$P(A, B, C) = P(A)\, P(B \mid A)\, P(C \mid B).$$

    That is a **Markov chain**: each variable depends only on the previous
    one. Language models like your capstone's bigram model make exactly
    this assumption about characters.
- exercise: coupled-tests-bayes
  answer: |
    1. Given $H = 0$, each marginal is $P(D_i = 1 \mid H = 0) = 0.1$ and
       $P(D_1 = D_2 = 1 \mid H=0) = 0.02$, so:

       | $P(D_1, D_2 \mid H=0)$ | $D_2 = 0$ | $D_2 = 1$ |
       |:--|--:|--:|
       | $D_1 = 0$ | 0.82 | 0.08 |
       | $D_1 = 1$ | 0.08 | 0.02 |

    2. $P(H = 1 \mid D_1 = 1) = \frac{0.99 \cdot 0.0015}{0.99 \cdot 0.0015 + 0.1 \cdot 0.9985} \approx 0.0147$.
    3. $P(D_1 = D_2 = 1 \mid H = 1) = 0.99^2 = 0.9801$, so
       $P(H = 1 \mid D_1 = D_2 = 1) = \frac{0.9801 \cdot 0.0015}{0.9801 \cdot 0.0015 + 0.02 \cdot 0.9985} \approx 0.0686$.

    About 6.9%: much less than if the tests were independent given
    $H = 0$ (which would give about 12.8%), because correlated errors make
    the second test far less informative.
- exercise: portfolio-stats
  answer: |
    The portfolio return is $r = \boldsymbol{\alpha}^\top \mathbf{s}$.

    1. Expected return: $E[r] = \boldsymbol{\alpha}^\top \boldsymbol{\mu}$
       (linearity of expectation).
    2. To maximize return alone, put all the money in the stock with the
       largest $\mu_i$: $\alpha_i = 1$ for $i = \arg\max_j \mu_j$ (assuming
       no short selling, $\alpha_i \geq 0$). That ignores risk entirely.
    3. Variance: $\textrm{Var}[r] = \boldsymbol{\alpha}^\top \boldsymbol{\Sigma} \boldsymbol{\alpha}$
       (from $\mathbf{v}^\top \boldsymbol{\Sigma} \mathbf{v} = \textrm{Var}[\mathbf{v}^\top \mathbf{x}]$ in the section).
    4. $\max_{\boldsymbol{\alpha}}\; \boldsymbol{\alpha}^\top \boldsymbol{\mu}$
       subject to $\boldsymbol{\alpha}^\top \boldsymbol{\Sigma} \boldsymbol{\alpha} \leq \sigma^2_{\max}$,
       $\mathbf{1}^\top \boldsymbol{\alpha} = 1$, and (optionally)
       $\boldsymbol{\alpha} \geq 0$. Equivalently, minimize variance for a
       target return.
