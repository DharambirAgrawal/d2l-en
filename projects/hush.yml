# Hush: the Chapter 2 project, built step by step inside the chapter.
project: Hush
subtitle: Smarter on-call alerts
page: chapter_preliminaries/project-alert-triage
steps:
  - page: chapter_preliminaries/ndarray
    title: Scores with broadcasting
    build: |
      Create your repository `hush`. Make a small tensor of fake metrics
      (shape `(100, 3)`: CPU, latency, error rate) and write
      `zscores(X)` that standardizes each column with **broadcasting**
      (no loops). Check that each column now has mean 0 and standard
      deviation 1.
  - page: chapter_preliminaries/pandas
    title: Load and clean the real telemetry
    build: |
      Download `metrics.csv` (see the Hush page). Load it with pandas, report
      the fraction of missing values per column and the incident rate, fill
      missing numbers with column means, and one-hot encode `region` with a
      column for missing regions.
    revisit: |
      *2.1:* apply your `zscores` to the cleaned numeric columns. Convert the
      DataFrame to a tensor and check shapes and dtypes.
  - page: chapter_preliminaries/linear-algebra
    title: Turn each window into one anomaly score
    build: |
      Score every 5-minute window by the **$\ell_2$ norm** of its z-score
      vector. Also try the $\ell_1$ norm. Which score puts more real
      incidents among its top 5%?
    revisit: |
      *2.2:* does the way you imputed missing values change the scores of
      the windows that had gaps? *2.1:* compute all norms at once with one
      reduction (no loop).
  - page: chapter_preliminaries/calculus
    title: Find the cheapest threshold
    build: |
      Pages cost 1, missed incidents cost 50. Write the total cost as a
      function of the alert threshold $t$ and plot it. Replace the hard
      "alert if score $\geq t$" with a smooth version
      $\sigma(k(\textrm{score} - t))$ so the cost is differentiable, and
      estimate $\frac{d\,\textrm{cost}}{dt}$ with a central difference.
    revisit: |
      *2.3:* compare the best threshold for the $\ell_2$ and $\ell_1$
      scores from Step 3.
  - page: chapter_preliminaries/autograd
    title: Let autograd tune the score
    build: |
      Give each metric a weight, score $= \|\mathbf{w} \odot \mathbf{z}\|_2$,
      and use **autograd** to adjust $\mathbf{w}$ (and the smooth threshold
      $t$) by gradient descent on the smooth cost from Step 4.
    revisit: |
      *2.4:* check autograd's gradient against your central difference.
      *2.3:* is the learned score still a norm? Which metric got the
      biggest weight, and does that make sense?
  - page: chapter_preliminaries/probability
    title: Why most alerts are false, and Hush's final report
    build: |
      With Bayes' theorem, show why a detector with 90% recall and 5%
      false positives is only about 36% precise at a 3% incident rate. Add a
      second, simpler detector (error rate above its 95th percentile) and
      compute the precision when **both** must fire (assuming conditional
      independence), then measure it on the data. Compare your final
      threshold against "page on the top 10%".
    revisit: |
      **Everything comes back:** cleaning (2.2), broadcasting (2.1), norms
      (2.3), the cost curve (2.4), and the learned weights (2.5). Finish
      the README with a results table and one sentence per section on how
      Hush used it.
