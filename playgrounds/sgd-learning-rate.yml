title: Tuning the Learning Rate and Batch Size
description: |
  Minibatch SGD on this section's problem ($\mathbf{w} = [2, -3.4]$,
  $b = 4.2$, 1000 examples), starting from zero. The plot shows the training
  loss (log scale) after each group of updates. Try:

  - a tiny learning rate (slow progress) vs. a large one (fast, until it
    **diverges** around $\eta \approx 2$),
  - batch size 1 (noisy but many updates per epoch) vs. 256 (smooth but few
    updates),
  - more epochs: the loss stops at the noise floor, it can't go lower.
params:
  - {name: lr, label: "learning rate $\\eta$", min: 0.005, max: 2.5, step: 0.005, value: 0.03}
  - {name: batch, label: "batch size", min: 1, max: 256, step: 1, value: 32}
  - {name: epochs, label: "epochs", min: 1, max: 10, step: 1, value: 3}
