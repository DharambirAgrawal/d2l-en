- "**Derivative:** $f'(x) = \\lim_{h \\to 0} \\frac{f(x+h) - f(x)}{h}$, the instantaneous rate of change = slope of the tangent."
- "Common derivatives: $(C)' = 0$, $(x^n)' = n x^{n-1}$, $(e^x)' = e^x$, $(\\ln x)' = 1/x$."
- "Rules: constant multiple, **sum** $(f+g)' = f' + g'$, **product** $(fg)' = fg' + gf'$, **quotient** $(f/g)' = \\frac{gf' - fg'}{g^2}$."
- "Not everything is differentiable (accuracy, AUC), so we optimize a differentiable **surrogate** loss."
- "**Partial derivative** $\\partial y / \\partial x_i$: treat all other variables as constants."
- "**Gradient** $\\nabla_{\\mathbf{x}} f = [\\partial_{x_1} f, \\ldots, \\partial_{x_n} f]^\\top$, the direction of steepest increase."
- "Useful gradients: $\\nabla_{\\mathbf{x}} \\mathbf{A}\\mathbf{x} = \\mathbf{A}^\\top$, $\\nabla_{\\mathbf{x}} \\mathbf{x}^\\top \\mathbf{A} \\mathbf{x} = (\\mathbf{A} + \\mathbf{A}^\\top)\\mathbf{x}$, $\\nabla_{\\mathbf{x}} \\|\\mathbf{x}\\|^2 = 2\\mathbf{x}$, $\\nabla_{\\mathbf{X}} \\|\\mathbf{X}\\|_F^2 = 2\\mathbf{X}$."
- "**Chain rule:** $\\frac{dy}{dx} = \\frac{dy}{du}\\frac{du}{dx}$; multivariate: sum over every path, $\\nabla_{\\mathbf{x}} y = \\mathbf{A} \\nabla_{\\mathbf{u}} y$."
- "**Gradient check:** central difference $\\frac{f(x+h) - f(x-h)}{2h}$ has error $O(h^2)$."
