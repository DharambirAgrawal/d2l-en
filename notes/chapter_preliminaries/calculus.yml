# Notes for chapter_preliminaries/calculus.md: each entry is shown at the end of the section
# whose heading matches "after".
- after: Derivatives and Differentiation
  notes:
  - '$f''(x) = \lim_{h \to 0} \frac{f(x+h) - f(x)}{h}$: instantaneous rate of change = slope of the tangent.'
  - $(C)' = 0$, $(x^n)' = n x^{n-1}$, $(e^x)' = e^x$, $(\ln x)' = 1/x$.
  - Sum, product $(fg)' = fg' + gf'$, and quotient $(f/g)' = \frac{gf' - fg'}{g^2}$ rules.
  - Non-differentiable objectives (accuracy, AUC) → optimize a differentiable **surrogate**.
- after: Partial Derivatives and Gradients
  notes:
  - '$\partial y / \partial x_i$: treat all other variables as constants. **Gradient** $\nabla_{\mathbf{x}} f$ = vector of all partials (steepest ascent direction).'
  - $\nabla_{\mathbf{x}} \mathbf{A}\mathbf{x} = \mathbf{A}^\top$, $\nabla_{\mathbf{x}} \mathbf{x}^\top\mathbf{A}\mathbf{x} = (\mathbf{A} + \mathbf{A}^\top)\mathbf{x}$, $\nabla_{\mathbf{x}} \|\mathbf{x}\|^2 = 2\mathbf{x}$, $\nabla_{\mathbf{X}} \|\mathbf{X}\|_F^2 = 2\mathbf{X}$.
- after: Chain Rule
  notes:
  - '$\frac{dy}{dx} = \frac{dy}{du}\frac{du}{dx}$; with many intermediate variables, **sum over all paths**: $\nabla_{\mathbf{x}} y = \mathbf{A} \nabla_{\mathbf{u}} y$ (a matrix product).'
- after: Discussion
  notes:
  - Gradients can be computed **automatically** by applying these rules backwards through the computation graph (backpropagation).
