- "**Autograd** builds a *computational graph* during the forward pass and applies the chain rule **backwards** through it (**backpropagation**)."
- "Recipe: (i) `x.requires_grad_(True)`; (ii) compute `y`; (iii) `y.backward()`; (iv) read `x.grad`."
- "Example: $y = 2\\mathbf{x}^\\top\\mathbf{x}$ has gradient $4\\mathbf{x}$."
- "**PyTorch accumulates gradients:** call `x.grad.zero_()` before the next backward pass."
- "`backward()` needs a **scalar**; for a vector `y`, use `y.sum().backward()` (sums the per-example gradients)."
- "`u = y.detach()`: same values, but gradients don't flow through `u`."
- "Autograd works through Python control flow (`if`, `while`): the graph is recorded for the path actually taken."
- "**Backward mode** = one pass per *output* (great for many parameters → one loss); forward mode = one pass per *input*."
- "Second derivatives (Hessians) are much more expensive: $n^2$ entries, and you differentiate the backward pass itself."
