# Notes for chapter_preliminaries/pandas.md: each entry is shown at the end of the section
# whose heading matches "after".
- after: Reading the Dataset
  notes:
  - '`pd.read_csv(path)` → `DataFrame`; `NA`/empty cells become `NaN` (missing).'
- after: Data Preparation
  notes:
  - Split columns into **inputs** and **target** with `iloc` (position) or by name (safer).
  - 'Missing values: **imputation** (fill estimates, e.g. `fillna(mean)`) or **deletion** (drop rows/columns).'
  - 'Categorical: `pd.get_dummies(df, dummy_na=True)` = one-hot, with a column for `NaN`.'
- after: Conversion to the Tensor Format
  notes:
  - 'Once all columns are numeric: `torch.tensor(df.to_numpy(dtype=float))`.'
- after: Discussion
  notes:
  - 'Real data: multiple tables, many data types, outliers, faulty sensors. Visualize before modeling.'
