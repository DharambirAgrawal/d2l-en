- "Scalars $x$ (0 axes), vectors $\\mathbf{x} \\in \\mathbb{R}^n$ (1 axis), matrices $\\mathbf{A} \\in \\mathbb{R}^{m \\times n}$ (2 axes), tensors $\\mathsf{X}$ (any). **Order** = number of axes; **dimensionality** = number of components."
- "Transpose: $[\\mathbf{A}^\\top]_{ij} = a_{ji}$; **symmetric** if $\\mathbf{A} = \\mathbf{A}^\\top$. `len(X)` = length of axis 0."
- "**Hadamard product** $\\mathbf{A} \\odot \\mathbf{B}$ = elementwise (`A * B`)."
- "**Reduction:** `A.sum(axis=0)` removes axis 0; `keepdims=True` keeps it (length 1) so you can **broadcast**: `A / A.sum(axis=1, keepdims=True)` makes rows sum to 1."
- "**Dot product:** $\\mathbf{x}^\\top \\mathbf{y} = \\sum_i x_i y_i$ (= `(x * y).sum()`). Weighted average if weights $\\geq 0$ sum to 1; cosine of the angle for unit vectors."
- "**Matrix–vector:** $\\mathbf{A}\\mathbf{x}$ = dot product of each row with $\\mathbf{x}$; maps $\\mathbb{R}^n \\to \\mathbb{R}^m$. Columns of $\\mathbf{A}$ = images of the unit vectors."
- "**Matrix–matrix:** $c_{ij} = \\mathbf{a}_i^\\top \\mathbf{b}_j$; $(n \\times k)(k \\times m) \\to n \\times m$, costs $\\approx nkm$. `A @ B`. Order of a chain product matters for cost!"
- "**Norm** properties: $\\|\\alpha\\mathbf{x}\\| = |\\alpha|\\|\\mathbf{x}\\|$, triangle inequality, $\\|\\mathbf{x}\\| > 0$ for $\\mathbf{x} \\neq 0$."
- "$\\ell_2$: $\\sqrt{\\sum_i x_i^2}$ (Euclidean). $\\ell_1$: $\\sum_i |x_i|$ (Manhattan, robust to outliers). $\\ell_p$: $(\\sum_i |x_i|^p)^{1/p}$. Frobenius: $\\sqrt{\\sum_{ij} x_{ij}^2}$."
- "Deep learning objectives (distances, errors) are usually norms."
