# Notes for chapter_preliminaries/ndarray.md: each entry is shown at the end of the section
# whose heading matches "after".
- after: Getting Started
  notes:
  - '**Tensor** = $n$-dimensional array (vector: 1 axis, matrix: 2, $k^\textrm{th}$-order tensor: $k$). Like NumPy''s `ndarray` + **GPU** + **autograd**.'
  - '`x.shape`, `x.numel()`, `x.reshape(3, -1)` (`-1` = infer). Create: `torch.arange(n)`, `zeros`, `ones`, `randn` ($\mathcal{N}(0,1)$), `torch.tensor([[...]])`.'
- after: Indexing and Slicing
  notes:
  - '`X[-1]` last row, `X[1:3]` rows 1–2 (stop excluded); one index applies to axis 0. `X[:2, :] = 12` writes in place.'
- after: Operations
  notes:
  - '**Elementwise** ops `+ - * / **`, `exp` lift scalar functions to tensors of the same shape.'
  - '`torch.cat((X, Y), dim=0)` stacks rows, `dim=1` columns. `X == Y` → boolean tensor. `X.sum()` → one-element tensor.'
- after: Broadcasting
  notes:
  - '**Broadcasting:** align shapes from the **right**; each pair must be equal or contain a 1; length-1 axes get copied. $(3,1) + (1,2) \to (3,2)$.'
- after: Saving Memory
  notes:
  - '`Y = Y + X` allocates **new memory**; `Y[:] = X + Y` or `Y += X` update **in place** (same `id`).'
- after: Conversion to Other Python Objects
  notes:
  - '`X.numpy()` / `torch.from_numpy(A)` share memory in PyTorch; `.item()`, `float()`, `int()` convert a size-1 tensor to a Python number.'
