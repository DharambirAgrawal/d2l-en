- "**Tensor** = $n$-dimensional array. 1 axis: vector, 2 axes: matrix, $k$ axes: $k^\\textrm{th}$-order tensor. Like NumPy's `ndarray` + **GPU** + **autograd**."
- "`x.shape` (length along each axis), `x.numel()` (total elements), `x.reshape(3, -1)` (`-1` = infer that axis)."
- "Create: `torch.arange(n)`, `zeros(shape)`, `ones(shape)`, `randn(shape)` ($\\mathcal{N}(0, 1)$), `tensor([[...]])`."
- "Indexing like Python lists: `X[-1]` last row, `X[1:3]` rows 1–2 (stop excluded), `X[:2, :] = 12` writes."
- "**Elementwise** ops (`+ - * / **`, `exp`) need equal shapes, or **broadcasting**."
- "**Broadcasting rule:** align shapes from the **right**; each pair must be equal or contain a 1; size-1 axes are copied. $(3,1) + (1,2) \\to (3,2)$."
- "`torch.cat((X, Y), dim=0)` stacks rows; `dim=1` stacks columns. `X == Y` gives a boolean tensor."
- "`Y = Y + X` allocates **new memory**; `Y[:] = X + Y` or `Y += X` updates **in place** (same `id`)."
- "`X.numpy()` / `torch.from_numpy(A)` share memory in PyTorch; `.item()` converts a size-1 tensor to a Python number."
