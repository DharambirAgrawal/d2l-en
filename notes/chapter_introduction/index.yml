- "**Machine learning** = programs that improve with experience (data). Use it when you can't write the rules but have many examples: *programming with data*."
- "**Model** = program with tunable **parameters** (knobs); **model family** = all programs you get by turning the knobs; **learning algorithm** = picks the knobs using data."
- "**Four components** of every ML problem: **data**, **model**, **objective (loss) function** (lower is better), **optimization algorithm** (usually gradient descent)."
- "**Training loop:** random model → look at data → tweak parameters to do better → repeat."
- "**Overfitting:** great on training data, poor on unseen data. Always evaluate on a held-out **test set**."
- "**Supervised** (features → labels): **regression** = *how much?* (squared loss); **classification** = *which one?* (cross-entropy loss); also tagging (multi-label), search/ranking, recommendation, **sequence learning**."
- "**Unsupervised:** clustering, subspace estimation (PCA), generative models. **Self-supervised:** create labels from the data itself (e.g., predict masked words)."
- "**Reinforcement learning:** agent, observations, actions, rewards, policy. Key problems: credit assignment, partial observability, **explore vs. exploit**."
- "**Decisions ≠ most likely class:** weigh outcomes by cost (the death cap mushroom: 20% risk × ∞ cost)."
- "**Deep learning** = many layers of learned transformations, trained **end to end**; replaces hand-made feature engineering. Fueled by big data + GPUs + good software frameworks."
