title: Bayes with Correlated Medical Tests
difficulty: hard
timeout: 5
description: |
  Exercise 7 (the HIV example with coupled tests). Each test alone has a
  false positive rate $P(D=1 \mid H=0) = 0.1$ and false negative rate
  $P(D=0 \mid H=1) = 0.01$. For infected patients the two tests are
  conditionally independent, but for healthy ones they are coupled:
  $P(D_1 = D_2 = 1 \mid H=0) = 0.02$. The prior is $P(H=1) = 0.0015$.

  Write `coupled_tests(prior, fpr, fnr, both_pos_healthy)` returning a dict:

  - `"table_healthy"`: 2x2 nested list `t` with
    `t[d1][d2]` $= P(D_1 = d1, D_2 = d2 \mid H=0)$,
  - `"posterior_one"`: $P(H=1 \mid D_1 = 1)$,
  - `"posterior_both"`: $P(H=1 \mid D_1 = 1, D_2 = 1)$.
explanation: |
  For healthy patients, each marginal must be $0.1$, so
  $P(1,0) = P(0,1) = 0.1 - 0.02 = 0.08$ and $P(0,0) = 1 - 0.02 - 0.16 = 0.82$.
  One positive test: $\frac{0.99 \cdot 0.0015}{0.99 \cdot 0.0015 + 0.1 \cdot 0.9985} \approx 0.0147$.
  Two positives: $P(D_1{=}D_2{=}1 \mid H{=}1) = 0.99^2$, so
  $\frac{0.9801 \cdot 0.0015}{0.9801 \cdot 0.0015 + 0.02 \cdot 0.9985} \approx 0.0686$.
  Compare the independent case: correlated tests add far less evidence, because
  a second test that tends to fail the same way tells you little new.
